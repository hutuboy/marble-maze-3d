<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 弹珠迷宫 · Marble Maze</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>
  <div class="vignette"></div>

  <header class="hud-top">
    <div class="brand">
      <span class="brand-mark"></span>
      <div>
        <div class="brand-title">3D 弹珠迷宫</div>
        <div class="brand-sub" id="levelName">载入中…</div>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><span class="stat-label">关卡</span><span class="stat-value" id="statLevel">1 / 3</span></div>
      <div class="stat"><span class="stat-label" id="statTimeLabel">计时</span><span class="stat-value" id="statTime">00:00</span></div>
      <div class="stat"><span class="stat-label">总分</span><span class="stat-value" id="statScore">0</span><span class="stat-sub" id="statReward">本关 +0</span></div>
      <div class="stat"><span class="stat-label">碰撞</span><span class="stat-value" id="statHits">0</span></div>
      <div class="stat"><span class="stat-label">宝石</span><span class="stat-value" id="statGems">0 / 3</span></div>
      <div class="stat"><span class="stat-label">检查点</span><span class="stat-value" id="statCheckpoints">0 / 0</span></div>
      <div class="stat"><span class="stat-label">生命</span><span class="stat-value" id="statLives">♥♥♥</span></div>
    </div>

    <div class="hud-actions">
      <button type="button" id="btnPause" class="icon-btn">暂停</button>
      <button type="button" id="btnRestart" class="icon-btn">重开</button>
      <button type="button" id="btnDifficulty" class="icon-btn">难度 标准</button>
      <button type="button" id="btnTilt" class="icon-btn">体感 关</button>
      <button type="button" id="btnQuality" class="icon-btn">画质 自动</button>
      <button type="button" id="btnMute" class="icon-btn">音效 开</button>
    </div>
  </header>

  <div id="statusPill" class="status-pill" data-tone="normal">准备开始</div>

  <button type="button" id="mapToggle" class="map-toggle" aria-label="展开或收起小地图">地图</button>

  <aside class="side-panel" id="sidePanel">
    <div class="panel-card">
      <div class="panel-title">迷宫俯视图</div>
      <canvas id="minimap" width="220" height="220"></canvas>
    </div>
    <div class="panel-card tilt-card">
      <div class="panel-title">当前倾角</div>
      <canvas id="tilt" width="120" height="120"></canvas>
      <div class="tilt-hint" id="tiltHint">方向键 / WASD<br>或按住左键拖动</div>
    </div>
  </aside>

  <footer class="hud-bottom">
    <div class="tips" id="tips">倾斜迷宫，把弹珠送进金色光柱标记的终点。</div>
    <div class="legend">
      <span><i class="dot start"></i>起点</span>
      <span><i class="dot goal"></i>终点</span>
      <span><i class="dot gem"></i>宝石</span>
      <span><i class="dot hole"></i>空洞</span>
      <span><i class="dot hazard"></i>熔岩</span>
      <span><i class="dot cp"></i>检查点</span>
      <span><i class="dot boost"></i>加速带</span>
      <span><i class="dot ice"></i>冰面</span>
    </div>
  </footer>

  <div id="levelFlash" class="level-flash"></div>
  <div id="toast" class="toast" data-tone="info"></div>
  <div id="joystick" class="joystick" aria-label="触屏方向摇杆"><div class="joystick-knob" id="joystickKnob"></div></div>

  <div id="overlay" class="overlay visible">
    <div class="modal" id="modal">
      <div class="modal-tag">MARBLE MAZE · 3D</div>
      <h1>3D 弹珠迷宫</h1>
      <p class="modal-lead">正在初始化场景…</p>
    </div>
  </div>
</div>
<script src="game.bundle.js"></script>
</body>
</html>
